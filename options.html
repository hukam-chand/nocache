<!DOCTYPE html>
<html>
<head>
  <title>NoCache Options</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      min-width: 300px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #4285f4;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #357abd;
    }
    #status {
      margin-top: 10px;
      color: green;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="form-group">
    <label for="paramName">Query Parameter Name:</label>
    <input type="text" id="paramName" placeholder="nocache">
    <small style="color: #666;">Default is "nocache"</small>
  </div>
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
